<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <!-- 玻璃本体填充：斜向紫色渐变，低透明度 -->
    <linearGradient id="mFill" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#D8B9FF" stop-opacity="0.62"/>
      <stop offset="0.5" stop-color="#A874F0" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#7B5BDE" stop-opacity="0.6"/>
    </linearGradient>
    <!-- 边缘折射：对角高光强、中段弱 -->
    <linearGradient id="mRim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.98"/>
      <stop offset="0.42" stop-color="#fff" stop-opacity="0.32"/>
      <stop offset="0.62" stop-color="#fff" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0.92"/>
    </linearGradient>
    <!-- 顶部镜面反光 -->
    <linearGradient id="mGloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect x="6" y="36" width="188" height="128" rx="64" fill="url(#mFill)"/>
  <rect x="6" y="36" width="188" height="128" rx="64" fill="none" stroke="url(#mRim)" stroke-width="11"/>
  <path d="M40 62 h120 a44 44 0 0 1 -9 19 h-102 a44 44 0 0 1 -9 -19 z" fill="url(#mGloss)"/>

  <circle cx="72" cy="100" r="25" fill="none" stroke="#fff" stroke-width="13"/>
  <line x1="90" y1="118" x2="107" y2="135" stroke="#fff" stroke-width="13" stroke-linecap="round"/>
  <line x1="126" y1="100" x2="162" y2="100" stroke="#fff" stroke-opacity="0.62" stroke-width="13" stroke-linecap="round"/>
</svg>
